[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fck-rkn"
version = "0.1.0"
description = "Tools for managing the fck-rkn-test environment"
requires-python = ">=3.10"
dependencies = [
    "pydantic-settings>=2.7,<3",
    "python-dotenv>=1.0,<2",
    "google-cloud-compute>=1.19,<2",
]

[project.scripts]
test-env-host = "fck_rkn.orchestration.test_environment:main"
eu-server-agent = "fck_rkn.agents.eu_server:main"
eu-server-test-agent = "fck_rkn.agents.eu_server_test:main"
ru-server-agent = "fck_rkn.agents.ru_server:main"
ru-server-test-agent = "fck_rkn.agents.ru_server_test:main"
test-client-agent = "fck_rkn.agents.test_client:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"fck_rkn.remote" = ["scripts/*"]
