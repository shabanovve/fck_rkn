# Access policy for the EU Squid. Order matters: the denials come first.
acl localnet src 10.0.0.0/8
acl localnet src 172.16.0.0/12
acl localnet src 192.168.0.0/16
acl localnet src fc00::/7
acl SSL_ports port 443
acl Safe_ports port 80
acl Safe_ports port 443
acl Safe_ports port 1025-65535
acl CONNECT method CONNECT

# Russian destinations: the .ru, .su and .рф (punycode xn--p1ai) TLDs and all
# their subdomains, with or without a trailing dot.
acl ru_domains dstdom_regex -i \.(ru|su|xn--p1ai)\.?$
acl ru_domains dstdom_regex -i ^(ru|su|xn--p1ai)\.?$

# Destinations given as an IP address literal. The URL is matched rather than
# the host name, because name ACLs make Squid resolve IP hosts first. Covers
# IPv6 in brackets, dotted IPv4 and the shortened decimal or hexadecimal forms,
# for plain requests (with optional user information) and CONNECT (host:port).
acl ip_literal url_regex -i ^([a-z][a-z0-9+.-]*://)?([^/@]*@)?(\[|(0x[0-9a-f]+|[0-9]+)(\.(0x[0-9a-f]+|[0-9]+))*\.?(:[0-9]+)?(/|$))

http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports
# Before the name rule: name ACLs make Squid reverse-resolve IP hosts.
http_access deny ip_literal
http_access deny ru_domains
http_access deny manager
http_access allow localhost
http_access allow localnet
http_access deny all

http_port 3128
logfile_rotate 0
coredump_dir /var/spool/squid
